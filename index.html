<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twenty Questions Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Neon game show. Podiums left and right, the question screen in the middle on a sunburst stage. */
:root{
  --bg:#140B28; --panel:#0E0720; --raise:#1D1238; --line:#2A1C4D; --line2:#3A2A63;
  --ink:#EDE7FF; --muted:#8B7FB3; --soft:#C9BFEA;
  --blue:#4FC3FF; --pink:#FF4FD8; --amber:#FFB347; --yes:#39FF9C; --no:#FF5C7A;
  --p1:var(--blue); --p2:var(--pink);
  --f-logo:"Monoton","Arial Black",Impact,sans-serif;
  --f-body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f-body);padding-inline:16px}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 190px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
h1,h2,h3{font-weight:700;text-wrap:balance;margin:0}
.glow-p{color:#FFE3FA;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 36px var(--pink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-family:var(--f-logo);font-weight:400;font-size:clamp(1.25rem,3.4vw,2.2rem);line-height:1.2}
.ghost{background:transparent;border:1.5px solid var(--line2);border-radius:999px;padding:8px 16px;font-size:.9rem;font-weight:600;color:var(--ink);min-height:40px}
.ghost:hover{border-color:var(--soft)}
.ghost.danger{color:var(--no);border-color:var(--no)}
.ghost.danger.armed{background:var(--no);color:var(--bg);box-shadow:0 0 16px var(--no)}
.label{font-size:.82rem;color:var(--muted);font-weight:600}
.banner{border:1.5px solid var(--line2);background:var(--panel);border-radius:16px;padding:12px 16px;margin-bottom:16px;color:var(--soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.warn{border-color:var(--no);box-shadow:0 0 12px rgba(255,92,122,.3)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font-weight:700}
.status{color:var(--muted)} .status.err{color:var(--no)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* Panels: home, setup, lobby */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:clamp(18px,4vw,34px);display:grid;gap:24px}
.panel h2{font-size:1.7rem}
.lede{color:var(--soft);max-width:62ch;margin:6px 0 0}
.hero{text-align:center;display:grid;gap:12px;justify-items:center}
.hero h2{font-family:var(--f-logo);font-weight:400;font-size:clamp(1.8rem,6vw,3.6rem);line-height:1.1}
.field{display:grid;gap:6px}
.field input,.joinrow input,.row input{border:2px solid var(--line2);background:var(--bg);border-radius:999px;padding:11px 18px;width:100%;color:var(--ink)}
.field input:focus,.joinrow input:focus,.row input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 12px rgba(79,195,255,.35)}
.field.p1 .label{color:var(--blue)} .field.p2 .label{color:var(--pink)}
.field.name input{font-weight:700;font-size:1.25rem;color:var(--blue);border-color:var(--blue);text-shadow:0 0 10px rgba(79,195,255,.6)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.mode{--c:var(--blue);border:2px solid var(--c);border-radius:26px;padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;background:var(--panel);box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.mode::before{content:"";height:4px;border-radius:4px;background:var(--c);box-shadow:0 0 8px var(--c)}
.mode.c-pink{--c:var(--pink)} .mode.c-amber{--c:var(--amber)}
.mode h3{font-size:1.4rem;color:var(--c)}
.mode p{margin:0;color:var(--soft);font-size:.95rem}
.mode .go{margin-top:auto;align-self:flex-start;background:var(--c)}
.mode>*{min-width:0}
.joinrow{display:flex;gap:8px;flex-wrap:wrap;min-width:0;margin-top:auto}
.joinrow input{flex:1 1 120px;min-width:0;text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:700}
.joinrow .go{margin:0}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats label{border:1.5px solid var(--line2);border-radius:999px;padding:7px 16px;cursor:pointer;background:var(--raise);font-weight:600;font-size:.95rem}
.cats input:checked+label{border-color:var(--amber);color:var(--amber);background:var(--panel);box-shadow:0 0 12px rgba(255,179,71,.45);text-shadow:0 0 8px rgba(255,179,71,.6)}
.cats input:focus-visible+label{outline:3px solid var(--amber);outline-offset:2px}
.cats input:disabled+label{cursor:default;opacity:.7}
.cats.small label{padding:5px 13px;font-size:.88rem}
.filters{display:grid;gap:12px;padding:16px;border:1.5px dashed var(--line2);border-radius:20px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fgroup{display:grid;gap:6px}
.flabel{font-size:.88rem;font-weight:700;color:var(--soft)}
.rules{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin:0;padding:0;list-style:none;color:var(--muted);font-size:.92rem}
.rules b{color:var(--soft)}
.go{--c:var(--blue);font-family:var(--f-body);font-weight:700;font-size:1.05rem;background:var(--c);color:var(--bg);border:0;border-radius:999px;padding:0 26px;min-height:50px;justify-self:start;box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.go.alt{--c:var(--pink);background:var(--pink)} .go.blue{--c:var(--blue)} .go.amber{--c:var(--amber);background:var(--amber)}
.go:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.code{font-weight:700;font-size:clamp(2.4rem,9vw,3.6rem);letter-spacing:.18em;color:var(--amber);line-height:1;text-shadow:0 0 14px rgba(255,179,71,.7)}
.coderow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.roster{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.roster li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-radius:999px;background:var(--raise);flex-wrap:wrap}
.roster .who{font-weight:700;overflow-wrap:anywhere;min-width:0}
.tag{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;color:var(--yes);border:1.5px solid var(--yes)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Stage: podium | screen | podium */
.stage{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr) minmax(250px,320px);gap:22px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}.stagebox{order:-1;min-height:0;padding:16px;border-radius:28px}.screen{gap:12px}}
.pod{--c:var(--p1);background:var(--panel);border:2px solid var(--line2);border-radius:28px;min-width:0;display:flex;flex-direction:column;transition:border-color .25s,box-shadow .25s,opacity .25s}
.pod.p2{--c:var(--p2)}
.pod.active{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 12%,transparent)}
.pod:not(.active){opacity:.85}
.pod.out{opacity:.55}
.stripes{display:grid;gap:5px;padding:14px 20px 0}
.stripes i{height:4px;border-radius:4px;background:var(--pink)}
.stripes i:nth-child(2){background:var(--blue)} .stripes i:nth-child(3){background:var(--amber)}
.pod.active .stripes i{box-shadow:0 0 8px currentColor}
.pod.active .stripes i:nth-child(1){color:var(--pink)} .pod.active .stripes i:nth-child(2){color:var(--blue)} .pod.active .stripes i:nth-child(3){color:var(--amber)}
.pod:not(.active) .stripes{opacity:.45}
.podhead{padding:14px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.podhead h2{font-size:2.2rem;line-height:1;color:var(--c);overflow-wrap:anywhere}
.pod.active .podhead h2{text-shadow:0 0 14px color-mix(in srgb,var(--c) 80%,transparent)}
.secret{font-size:.82rem;color:var(--muted);margin-top:6px}
.secret b{color:var(--soft)}
.count{display:flex;gap:3px;align-items:flex-end;white-space:nowrap}
.dig{background:var(--raise);color:var(--amber);font-weight:700;font-size:1.75rem;width:1.15em;text-align:center;border-radius:6px;line-height:1.25;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,179,71,.75)}
.count .of{font-weight:600;font-size:.85rem;color:#7D6A4A;padding:0 0 4px 4px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:6px;background:var(--c);color:var(--bg)}
.pill.dim{background:transparent;color:var(--muted);padding:2px 0}
.podbody{padding:14px 20px 20px;display:grid;gap:12px}
.hints{display:grid;gap:8px}
.hint{border:1.5px solid var(--amber);border-radius:16px;padding:8px 13px;font-size:.93rem;font-weight:600;box-shadow:0 0 10px rgba(255,179,71,.22);overflow-wrap:anywhere}
.hint .hk{color:var(--amber)}
.hint.locked{border-style:dashed;border-color:var(--line2);box-shadow:none;color:var(--muted);font-weight:500}
.log{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.log li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--raise);border-radius:20px;padding:7px 7px 7px 15px;font-size:.93rem}
.log .q{min-width:0;overflow-wrap:anywhere}
.log .note{display:block;color:var(--muted);font-size:.8rem}
.ans{font-weight:700;font-size:.75rem;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1.5px solid currentColor}
.ans.y,.ans.c{color:var(--yes);text-shadow:0 0 8px var(--yes);box-shadow:0 0 8px rgba(57,255,156,.4)}
.ans.n,.ans.w{color:var(--no);text-shadow:0 0 8px var(--no);box-shadow:0 0 8px rgba(255,92,122,.4)}
.ans.s{color:var(--amber);text-shadow:0 0 8px var(--amber)}
.ans.u,.ans.p{color:var(--muted)}
.ans.t{color:var(--amber);text-shadow:0 0 8px var(--amber)}
.empty{color:var(--muted);font-size:.92rem;margin:0}

/* Center screen */
.stagebox{border-radius:36px;background:#160C2E;background-image:repeating-conic-gradient(from 0deg at 50% 62%,#160C2E 0 9deg,#1D1240 9deg 18deg);border:2px solid var(--line);padding:clamp(16px,3vw,32px);display:grid;place-items:center;min-height:clamp(260px,46vh,440px)}
.screen{background:var(--panel);border:3px solid var(--pink);border-radius:30px;padding:clamp(18px,3vw,32px);display:grid;justify-items:center;gap:18px;text-align:center;width:min(100%,560px);box-shadow:0 0 24px var(--pink),inset 0 0 24px rgba(255,79,216,.22)}
.screen .who{font-size:.95rem;font-weight:600;color:#FF9EEA}
.screen .bigq{margin:0;font-size:clamp(1.5rem,3.4vw,2.8rem);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.lights{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.light{font-weight:700;font-size:clamp(1rem,1.8vw,1.3rem);padding:6px 22px;border-radius:999px;border:2.5px solid var(--line2);color:#4C3E78}
.light.on.y,.light.on.c{border-color:var(--yes);color:#DFFFEF;text-shadow:0 0 10px var(--yes);box-shadow:0 0 16px var(--yes),inset 0 0 12px rgba(57,255,156,.35)}
.light.on.n,.light.on.w{border-color:var(--no);color:#FFE3E8;text-shadow:0 0 10px var(--no);box-shadow:0 0 16px var(--no),inset 0 0 12px rgba(255,92,122,.35)}
.light.on.s{border-color:var(--amber);color:#FFF1DC;text-shadow:0 0 10px var(--amber);box-shadow:0 0 16px var(--amber)}
.screen .sub{font-size:.9rem;color:var(--muted)}

/* Console */
.console{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--c,var(--blue));box-shadow:0 -6px 22px color-mix(in srgb,var(--c,var(--blue)) 20%,transparent);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
.console .in{max-width:680px;margin:0 auto;display:grid;gap:8px;position:relative}
.console.p1{--c:var(--p1)} .console.p2{--c:var(--p2)}
.turnline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--soft)}
.turnline b{color:var(--c)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.row input:focus{border-color:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent)}
.btn{border:0;border-radius:999px;padding:0 20px;min-height:48px;font-weight:700;white-space:nowrap}
.btn.ask{background:var(--blue);color:var(--bg);box-shadow:0 0 16px rgba(79,195,255,.55)}
.btn.guess{background:var(--pink);color:var(--bg);box-shadow:0 0 16px rgba(255,79,216,.55)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.answers{display:flex;gap:8px;flex-wrap:wrap}
.answers .btn{flex:1 1 110px;background:transparent;border:2.5px solid currentColor;font-size:1.05rem}
.btn.y{color:var(--yes);text-shadow:0 0 8px var(--yes);box-shadow:0 0 12px rgba(57,255,156,.4)}
.btn.n{color:var(--no);text-shadow:0 0 8px var(--no);box-shadow:0 0 12px rgba(255,92,122,.4)}
.btn.s{color:var(--amber);text-shadow:0 0 8px var(--amber)}
.btn.u{color:var(--muted);border-color:var(--line2)!important}
.askedq{font-size:1.15rem;font-weight:700;overflow-wrap:anywhere}
.yoursecret{font-size:.85rem;color:var(--muted)}
.yoursecret b{color:var(--ink)}
.wikilink{display:inline-block;font-size:.85rem;font-weight:700;color:var(--blue)}
.secret .wikilink{margin-left:4px}

/* Pass-the-device cover */
.cover{position:fixed;inset:0;background:var(--bg);background-image:repeating-conic-gradient(from 0deg at 50% 0%,#140B28 0 6deg,#180E31 6deg 12deg);z-index:10;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.cover .card{--c:var(--blue);background:var(--panel);border:2px solid var(--c);border-radius:28px;padding:clamp(20px,5vw,36px);max-width:560px;width:100%;display:grid;gap:18px;box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent)}
.cover.p2 .card{--c:var(--pink)}
.cover h2{font-size:clamp(1.5rem,5vw,2.2rem);color:var(--c);line-height:1.15;text-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent)}
.cover .go{background:var(--c)!important}
.bigsecret{border:2px solid var(--amber);border-radius:20px;padding:14px 18px;box-shadow:0 0 14px rgba(255,179,71,.3)}
.bigsecret .what{font-size:1.8rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere;color:var(--amber);text-shadow:0 0 12px rgba(255,179,71,.6)}

/* Results */
.result{background:var(--panel);border:2px solid var(--amber);border-radius:28px;padding:clamp(18px,4vw,30px);margin-bottom:22px;display:grid;gap:18px;box-shadow:0 0 26px rgba(255,179,71,.3)}
.result h2{font-family:var(--f-logo);font-weight:400;font-size:clamp(1.4rem,4.5vw,2.4rem);line-height:1.2;color:#FFF1DC;text-shadow:0 0 8px var(--amber),0 0 22px var(--amber)}
.reveals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.reveal{--c:var(--p1);border:2px solid var(--c);border-radius:22px;padding:14px 18px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.reveal.p2{--c:var(--p2)}
.reveal .who{color:var(--c);font-weight:700}
.reveal .what{font-size:1.6rem;font-weight:700;line-height:1.15;margin:4px 0 8px;overflow-wrap:anywhere}
.reveal a{color:var(--c);font-weight:700}
/* Sound toggle, reactions, celebration */
.ghost.icon{display:inline-flex;align-items:center;gap:6px}
.ghost.icon svg{width:18px;height:18px}
.reacts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.reacts button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line2);background:var(--raise);font-size:1.3rem;line-height:1;padding:0;transition:transform .12s,border-color .12s}
.reacts button:hover{border-color:var(--amber);transform:translateY(-2px)}
.reacts button:active{transform:scale(.92)}
.floatmoji{position:fixed;z-index:30;pointer-events:none;display:grid;justify-items:center;gap:2px;animation:floatup 2.4s cubic-bezier(.2,.7,.3,1) forwards}
.floatmoji .e{font-size:3rem;line-height:1;filter:drop-shadow(0 0 12px rgba(255,79,216,.55))}
.floatmoji .n{font-size:.8rem;font-weight:700;color:var(--soft);background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}12%{transform:translateY(-30px) scale(1.15);opacity:1}100%{transform:translateY(-260px) scale(1);opacity:0}}
.result.win{animation:marquee .5s steps(2) 10}
@keyframes marquee{0%{border-color:var(--amber);box-shadow:0 0 30px rgba(255,179,71,.6)}100%{border-color:var(--pink);box-shadow:0 0 30px rgba(255,79,216,.6)}}
#confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
/* Easter eggs */
.top h1{cursor:default;user-select:none;-webkit-user-select:none}
.stripes{cursor:pointer}
.stripes.flash i{animation:stripeflash .55s ease-out both}
.stripes.flash i:nth-child(2){animation-delay:.12s} .stripes.flash i:nth-child(3){animation-delay:.24s}
@keyframes stripeflash{0%{filter:none;transform:scaleX(1)}35%{filter:brightness(2.2) drop-shadow(0 0 8px currentColor);transform:scaleX(1.04)}100%{filter:none;transform:scaleX(1)}}
.eggmodal{position:fixed;inset:0;z-index:40;background:rgba(10,5,24,.86);display:grid;place-items:center;padding:16px}
.eggmodal .card{background:var(--panel);border:2px solid var(--amber);border-radius:28px;padding:clamp(16px,4vw,26px);width:min(100%,680px);display:grid;gap:14px;box-shadow:0 0 30px rgba(255,179,71,.4)}
.eggmodal h2{font-family:var(--f-logo);font-weight:400;font-size:clamp(1.2rem,4vw,1.9rem);color:#FFF1DC;text-shadow:0 0 8px var(--amber),0 0 22px var(--amber);line-height:1.2}
.eggmodal .vid{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.eggmodal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.eggtoast{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:45;pointer-events:none;font-family:var(--f-logo);font-size:clamp(1.3rem,5vw,2.4rem);color:#DFFFEF;text-shadow:0 0 8px var(--yes),0 0 26px var(--yes);white-space:nowrap;animation:toast 2.2s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
/* Arcade mode (Konami code): a '90s arcade fighting-game look */
/* Daytime street stage: sky blue, sandstone, jade, signboard red, gold (original backdrop, no game art) */
html.arcade{--f-logo:"Press Start 2P",ui-monospace,monospace;--f-body:"Press Start 2P",ui-monospace,monospace;font-size:11px;
  --bg:#5AA6E6;--panel:rgba(18,34,44,.92);--raise:#1F3D47;--line:#2E5A62;--line2:#4AA89A;--ink:#FFFFFF;--muted:#A8C8C2;--soft:#EDE4B8;
  --blue:#3E8EDB;--pink:#D8283A;--amber:#F2C230;--yes:#52C98E;--no:#E8394A;--px:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000;color-scheme:dark}
html.arcade body{line-height:1.8;background:
  radial-gradient(60px 18px at 12% 14%,#fff 98%,transparent),radial-gradient(90px 22px at 17% 12%,#fff 98%,transparent),
  radial-gradient(70px 16px at 62% 9%,#fff 98%,transparent),radial-gradient(110px 24px at 69% 11%,#fff 98%,transparent),
  radial-gradient(50px 14px at 88% 22%,#fff 98%,transparent),radial-gradient(80px 18px at 40% 26%,#F4FAFF 98%,transparent),
  linear-gradient(#3F8FDC 0%,#6DB4EC 45%,#A9D6F4 72%,#D9EEF8 78%) fixed}

<script src="catalog.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
"use strict";
// ---------- Catalog ----------
const RAW = window.CATALOG || {};
const okItem = it => it && typeof it.name === "string" && it.name.trim() && Array.isArray(it.hints);
const CATS = Object.keys(RAW).filter(c => Array.isArray(RAW[c]) && RAW[c].filter(okItem).length >= 2);
const itemsOf = c => RAW[c].filter(okItem);
// ---------- Filters (defined in catalog.js) ----------
const FILTERS = window.FILTERS || {}, YB = window.YEAR_BUCKETS || {}, MIN_POOL = 4;
function groupOptions(cat) {
  return (FILTERS[cat] || []).map(g => ({ id: g.id, label: g.label, opts: g.years
    ? (YB[g.years] || []).map(b => ({ key: b.key, label: b.label, test: it => Number.isInteger(it.year) && (b.from == null || it.year >= b.from) && (b.to == null || it.year <= b.to) }))
    : Object.entries(g.options || {}).map(([k, l]) => ({ key: k, label: l, test: it => Array.isArray(it.tags) && it.tags.includes(k) })) }));
}
function cleanFilters(cat, f) {
  const out = {};
  if (!CATS.includes(cat) || !f || typeof f !== "object") return out;
  for (const g of groupOptions(cat)) {
    const sel = Array.isArray(f[g.id]) ? f[g.id].filter(k => g.opts.some(o => o.key === k)) : [];
    if (sel.length) out[g.id] = sel;

}
function filteredItems(cat, f) {
  const groups = groupOptions(cat), sel = cleanFilters(cat, f);
  return itemsOf(cat).filter(it => groups.every(g => !sel[g.id] || g.opts.some(o => sel[g.id].includes(o.key) && o.test(it))));
}
const poolOK = (cat, f) => !CATS.includes(cat) || filteredItems(cat, f).length >= MIN_POOL;
function filterSummary(cat, f) {

}
const MAX = 20, HE = 3, HC = 5, PREFIX = "tq-duel-v1-";
const COUNTS = new Set(["y","n","s","w","c","t"]);
const LABEL = { y:"YES", n:"NO", s:"SOMETIMES", w:"WRONG", c:"RIGHT", u:"REPHRASE", t:"TIME", p:"…" };

// ---------- Utilities ----------
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wikiUrl = it => "https://en.wikipedia.org/wiki/Special:Search?go=Go&search=" + encodeURIComponent(it.wiki || it.name);
// Only ever called with a secret the CURRENT viewer is allowed to see (the one they answer for).
const hasWiki = it => !!it && !it.custom && it.wiki !== "";
const wikiLinkHTML = it => hasWiki(it) ? `<a class="wikilink" href="${wikiUrl(it)}" target="_blank" rel="noopener">Wikipedia ↗</a>` : "";
// Custom secrets: a player writes the secret their opponent has to guess. No clues or Wikipedia link.
const customItem = name => ({ name: String(name).trim().slice(0, 60), wiki: "", custom: true, hints: [] });
const customKind = k => String(k || "").trim().slice(0, 30) || "Custom";
function modeChips(custom, disabled) {
  return [["catalog", "From the catalog"], ["custom", "Write your own"]].map(([v, l], i) =>
    `<input type="radio" name="smode" id="smode-${i}" value="${v}" ${(v === "custom") === !!custom ? "checked" : ""} ${disabled ? "disabled" : ""}><label for="smode-${i}">${l}</label>`).join("");
}
const TIMERS = [[0, "Off"], [30, "30 sec"], [60, "60 sec"], [90, "90 sec"]];
function timerChips(sel, disabled) {
  return TIMERS.map(([v, l], i) => `<input type="radio" name="tmr" id="tmr-${i}" value="${v}" ${(+sel || 0) === v ? "checked" : ""} ${disabled ? "disabled" : ""}><label for="tmr-${i}">${l}</label>`).join("");
}
// Rock paper scissors decides who asks first.
// Easter egg: after 3 ties in a row, lizard and Spock join (rock paper scissors lizard Spock).
const RPS = { r: ["✊", "Rock"], p: ["✋", "Paper"], s: ["✌️", "Scissors"], l: ["🦎", "Lizard"], k: ["🖖", "Spock"] };
const BEAT = { r: { s: "crushes", l: "crushes" }, p: { r: "covers", k: "disproves" }, s: { p: "cuts", l: "decapitates" }, l: { p: "eats", k: "poisons" }, k: { s: "smashes", r: "vaporizes" } };
const beats = (a, b) => !!(BEAT[a] && BEAT[a][b]);
const UNIVERSE = 3;
const universeNote = `<p class="rpsmsg" style="color:var(--yes);text-shadow:0 0 10px rgba(57,255,156,.6)">The universe can't decide. Lizard and Spock have joined the game!</p>`;
const rpsButtonsHTML = ext => `<div class="rpsrow">${Object.entries(RPS).filter(([k]) => ext || "rps".includes(k)).map(([k, [h, n]]) => `<button type="button" class="rpsbtn" data-rps="${k}"><span class="h" aria-hidden="true">${h}</span>${n}</button>`).join("")}</div>`;
// Walk the rounds both players have thrown. Ties roll over to the next round.
function rpsResolve(mine, theirs) {
  let ties = 0;
  for (let r = 0; ; r++) {
    const a = mine[r], b = theirs[r];
    if (!a) return { state: "pick", round: r, ties, last: r ? { a: mine[r - 1], b: theirs[r - 1] } : null };
    if (!b) return { state: "wait", round: r, ties, mine: a };
    if (a === b) { ties++; continue; }
    return { state: "done", round: r, ties, a, b, iWin: beats(a, b) };

}
function rpsFaceHTML(nameA, a, nameB, b, aWon) {
  return `<div class="rpsface"><div class="side ${a === b ? "" : aWon ? "won" : "lost"}"><span class="h">${RPS[a][0]}</span><span class="nm">${esc(nameA)}</span></div>
    <span class="vs">vs</span><div class="side ${a === b ? "" : aWon ? "lost" : "won"}"><span class="h">${RPS[b][0]}</span><span class="nm">${esc(nameB)}</span></div></div>`;
}
const rpsWhy = (w, l) => `${RPS[w][1]} ${BEAT[w][l]} ${l === "k" ? "Spock" : RPS[l][1].toLowerCase()}.`;
function writeFormHTML(id, forName, secretVal, kindVal) {
  return `<form class="writeform" id="${id}" style="display:grid;gap:14px">
    <div class="field"><label class="label" for="wSecret">Secret for ${esc(forName)}</label>
      <input id="wSecret" maxlength="60" value="${esc(secretVal || "")}" placeholder="Grandma's lasagna" autocomplete="off"></div>
    <div class="field"><label class="label" for="wKind">What kind of thing is it? (optional, ${esc(forName)} sees this)</label>
      <input id="wKind" maxlength="30" value="${esc(kindVal || "")}" placeholder="Food" autocomplete="off"></div>
    <span class="status err" id="wErr"></span>
    <button class="go" type="submit">Lock it in</button></form>`;
}
// Custom games: the secret's writer adds a clue for the guesser every 3 turns.
const clueDue = (item, used) => { for (let k = 0; k < HC && used >= HE * (k + 1); k++) if (item.hints[k] === undefined || item.hints[k] === null) return k; return -1; };
function clueFormHTML(id, forName, k, secretName) {
  return `<form id="${id}" style="display:grid;gap:12px">
    <div class="field"><label class="label" for="clueIn">Clue ${k + 1} of ${HC} for ${esc(forName)} (their secret: ${esc(secretName)})</label>
      <input id="clueIn" maxlength="120" placeholder="${k < 2 ? "Start vague, like: It's something you eat." : "Get more specific with each clue."}" autocomplete="off"></div>
    <div class="actions"><button class="go" type="submit">Give clue</button><button class="ghost" type="button" id="clueSkip">Skip this clue</button></div></form>`;
}
function readWriteForm() {
  const secret = (document.getElementById("wSecret").value || "").trim(), kind = document.getElementById("wKind").value;
  if (secret.length < 2) { document.getElementById("wErr").textContent = "Type a secret first."; document.getElementById("wSecret").focus(); return null; }
  return { item: customItem(secret), kind: customKind(kind) };
}
const rid = (n, abc = "abcdefghijkmnpqrstuvwxyz23456789") => Array.from({length: n}, () => abc[Math.floor(Math.random() * abc.length)]).join("");
const CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const mkStore = s => ({
  get(k) { try { return JSON.parse(s.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { s.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { s.removeItem(k); } catch (e) {} }
});
let LS, SS;
try { LS = mkStore(window.localStorage); } catch (e) { LS = { get(){return null}, set(){}, del(){} }; }
try { SS = mkStore(window.sessionStorage); } catch (e) { SS = LS; }
const countR = es => es.filter(e => COUNTS.has(e.code)).length;
const hasWon = es => es.some(e => e.code === "c");
const hintsFor = (item, r) => (item ? item.hints : []).slice(0, Math.min(HC, Math.floor(r / HE)));

function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/\(.*?\)/g, " ").replace(/&/g, " and ").replace(/[^a-z0-9 ]/g, " ")
    .replace(/\b(the|a|an)\b/g, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function localMatch(guess, item) {
  const g = norm(guess); if (!g) return false;
  return [item.name, item.wiki || item.name].map(norm).some(t => {
    if (g === t || g.replace(/ /g, "") === t.replace(/ /g, "")) return true;
    const d = lev(g, t);
    return (t.length >= 5 && d <= 1) || (t.length >= 9 && d <= 2);

// Host deals from even positions, guest from odd, so two players never get the same item.
function dealFrom(catSetting, parity, filters) {
  const chosen = CATS.includes(catSetting);
  const cat = chosen ? catSetting : pick(CATS);
  const filtered = chosen ? filteredItems(cat, filters) : itemsOf(cat);
  const list = filtered.length >= 2 ? filtered : itemsOf(cat);
  const pool = parity == null ? list : list.filter((_, i) => i % 2 === parity);
  return { cat, item: pick(pool.length ? pool : list) };
}

// ---------- App state ----------
let screen = "home";   // home | local-setup | local | online
const params = new URLSearchParams(location.search);
const draft = { name: LS.get("tq:name") || "", code: (params.get("join") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6), p1: "Player 1", p2: "Player 2", cat: "Mix", filters: {}, custom: false, timer: +(LS.get("tq:timer") || 0) };

const setStatus = (m, err) => { statusMsg = m || ""; statusErr = !!err; };
const PeerOK = typeof window.Peer === "function";

// ===================================================================
// SAME-SCREEN MODE (pass the device to answer)
// ===================================================================
let L = null;
function localNew(n1, n2, catChoice, filters, custom) {
  if (custom) {
    L = { players: [{ name: n1, cat: "?", item: null, entries: [] }, { name: n2, cat: "?", item: null, entries: [] }],
          turn: Math.random() < .5 ? 0 : 1, catChoice, filters, custom: true, writer: 0, stage: "wpass", pending: null, timer: draft.timer || 0 };
    screen = "local"; setStatus(""); lastConsoleKey = "";
    render(); return;
  }
  filters = normalizeFilters(catChoice, filters);
  const a = dealFrom(catChoice, 0, filters), b = dealFrom(catChoice === "Mix" ? "Mix" : a.cat, 1, filters);
  L = { players: [{ name: n1, cat: a.cat, item: a.item, entries: [] }, { name: n2, cat: b.cat, item: b.item, entries: [] }],
        turn: 0, catChoice, filters, stage: "rpsPass", rps: { picks: [null, null], picker: 0 }, pending: null, timer: draft.timer || 0 };
  screen = "local"; setStatus(""); lastConsoleKey = "";
  render();
}
function localOver() {
  const w = L.players.findIndex(p => hasWon(p.entries));
  if (w >= 0) return { over: true, winner: w };
  if (L.players.every(p => countR(p.entries) >= MAX)) return { over: true, winner: null };
  if (L.ended) return { over: true, winner: null, endedBy: "Someone" };

}
function localAct(kind) {
  const input = document.getElementById("qInput");

  if (kind === "q" && countR(p.entries) >= MAX - 1) { setStatus("Last turn. Make your guess.", true); render(); return; }
  clearInput(); setStatus("");
  if (kind === "g" && localMatch(text, p.item)) { localRecord({ kind, text }, "c"); return; }
  L.pending = { kind, text };
  L.stage = countR(L.players[1 - L.turn].entries) >= 0 ? "pass" : "answer";
  render();
}
function localRecord(action, code) {
  const p = L.players[L.turn];

  L.last = { pi: L.turn, idx: p.entries.length - 1 };
  L.pending = null;
  if (code === "c") { L.stage = "ask"; render(); return; }
  if (code === "u") { L.stage = "back"; render(); return; }
  setStatus(action.kind === "q" ? `${p.name} asked. ${LABEL[code]}.` : `${p.name} guessed “${action.text}”. Wrong.`, code === "w");
  const asker = L.turn, o = 1 - L.turn;

    || (screen === "online" && O && O.st.g && O.st.secret && O.st.myCat && O.st.rpsDone !== false && !onlineState().over);
  const eb = document.getElementById("endBtn");

function catChips(selected, disabled) {

// Filters cascade: the first group shows first. Each next group appears once the picks
// above it cover enough items to play, and only offers options that still match something.
function filterSteps(cat, f) {
  if (!CATS.includes(cat)) return { steps: [], filters: {} };   // "Mix it up" has no filters
  const sel = cleanFilters(cat, f), filters = {}, steps = [];
  let pool = itemsOf(cat);
  for (const g of groupOptions(cat)) {
    const opts = g.opts.filter(o => pool.some(o.test));
    if (!opts.length) break;
    const picked = (sel[g.id] || []).filter(k => opts.some(o => o.key === k));
    steps.push({ g, opts, picked });
    if (!picked.length) break;
    filters[g.id] = picked;
    pool = pool.filter(it => g.opts.some(o => picked.includes(o.key) && o.test(it)));
    if (pool.length < MIN_POOL) break;
  }
  return { steps, filters };
}
const normalizeFilters = (cat, f) => filterSteps(cat, f).filters;
function filtersHTML(cat, f, disabled) {
  if (!CATS.includes(cat)) return `<span class="status" style="font-size:.88rem">“Mix it up” gives each player a different random category. Pick a single category to use filters.</span>`;
  const { steps, filters } = filterSteps(cat, f);
  if (!steps.length) return "";
  if (disabled && !Object.keys(filters).length) return `<span class="status" style="font-size:.88rem">No filters: everything in this category is in play.</span>`;
  const rows = steps.filter(st => !disabled || st.picked.length).map(({ g, opts, picked }) => {
    const chips = opts.filter(o => !disabled || picked.includes(o.key)).map(o => {
      const id = `f-${g.id}-${o.key}`;
      return `<input type="checkbox" id="${esc(id)}" data-g="${esc(g.id)}" data-k="${esc(o.key)}" ${picked.includes(o.key) ? "checked" : ""} ${disabled ? "disabled" : ""}><label for="${esc(id)}">${esc(o.label)}</label>`;
    }).join("");
    return `<div class="fgroup"><span class="flabel">${esc(g.label)}</span><div class="cats small">${chips}</div></div>`;
  }).join("");
  return `<div class="filters"><div class="fhead"><span class="label">Filters${disabled ? " (host picks)" : " (optional)"}</span></div>${rows}</div>`;
}
function readFilters(root) {

function podHTML(vm, p, i) {

    if (p.used >= HE * (k + 1)) {

      return `<li><span class="q">${txt}${note ? `<span class="note">${note}</span>` : ""}</span><span class="ans ${code}">${LABEL[code]}</span></li>`;
    }).join("")}</ol>` : `<p class="empty">No questions yet.</p>`;
  return `<section class="pod p${i + 1}${active ? " active" : ""}${p.used >= MAX && !vm.over ? " out" : ""}">

function centerHTML(vm) {
  const names = vm.players.map(p => p.name.replace(/ \(you\)$/, ""));
  let who = "", text = "", code = null, kind = "q", sub = "";
  if (vm.mode === "online") {

    if (st.toAnswer) { who = `${names[1 - st.me]} asks · you answer`; text = st.toAnswer.text; kind = st.toAnswer.kind; sub = "Answer below."; }
    else if (st.pending) { const e = st.mine[st.mine.length - 1]; who = `You ${e.kind === "q" ? "asked" : "guessed"}`; text = e.text; kind = e.kind; sub = `Waiting for ${names[1 - st.me]} to answer…`; }
    else {
      const mineLast = st.mine[st.mine.length - 1], theirLast = st.theirs[st.theirs.length - 1];

  }

  if (kind === "t") {
    return `<section class="stagebox"><div class="screen">${clock}<span class="who">${esc(who.replace(/ (asked|guessed).*$/, ""))}</span>
      <p class="bigq">Time's up!</p><span class="sub">The clock ran out, so that turn counts.</span></div></section>`;
  }
  if (!text) {

    return `<section class="stagebox"><div class="screen">${clock}<span class="who">Round one</span>
      <p class="bigq">${esc(first)} goes first</p><span class="sub">Ask a yes-or-no question about your secret.</span></div></section>`;
  }
  const opts = kind === "q" ? [["y", "YES"], ["n", "NO"], ["s", "SORT OF"]] : [["c", "RIGHT"], ["w", "WRONG"]];

// ---------- Console ----------
function localConsole(vm) {
  const p = vm.players[vm.turn], last = p.used >= MAX - 1;
  return { seat: vm.turn, kind: "ask", canAct: L.stage === "ask", last,
    lead: `<b>${esc(p.name)}</b>, ${last ? "make your final guess." : "ask about your secret or take a guess."}`,
    status: statusMsg || (last ? "Last turn: you must guess." : `Turn ${p.used + 1} of ${MAX}`), statusErr: statusMsg ? statusErr : false,
    onAct: k => localAct(k) };
}
function onlineConsole(vm) {
  const st = vm.st, used = st.R[st.me], last = used >= MAX - 1, s = O.st;
  if (st.toAnswer) {
    const q = st.toAnswer;
    return { seat: st.me, kind: "answer", id: q.id, q,
      lead: `<b>${esc(vm.oppName)}</b> ${q.kind === "q" ? "asks" : "guesses"}:`, status: "", statusErr: false };
  }
  if (s.gameCustom && s.secret) {
    const k = clueDue(s.secret, st.R[1 - st.me]);
    if (k >= 0) return { seat: st.me, kind: "clue", k, lead: `<b>Clue time.</b> ${esc(vm.oppName)} has used ${st.R[1 - st.me]} turns. Write them a clue.` };
  }
  let lead, status = statusMsg, thinking = false;
  if (used >= MAX) { lead = `You're out of turns. ${esc(vm.oppName)} is still playing.`; }
  else if (st.pending) { lead = `Waiting for <b>${esc(vm.oppName)}</b> to answer.`; thinking = true; status = "Waiting"; }
  else if (st.turn === st.me) lead = `<b>Your turn.</b> ${last ? "Make your final guess." : "Ask about your secret or take a guess."}`;
  else { lead = `<b>${esc(vm.oppName)}</b> is thinking of a question.`; thinking = true; status = "Waiting"; }
  if (!O.conn) { lead = `${esc(vm.oppName)} is disconnected.`; thinking = false; status = "Waiting for them to reconnect."; }
  if (!status) status = last ? "Last turn: you must guess." : `Turn ${used + 1} of ${MAX}`;
  if (st.lastCode === "u" && !st.pending && st.turn === st.me && !statusMsg) status = `${vm.oppName} says that's not a yes-or-no question. Ask another way.`;
  return { seat: st.me, kind: "ask", canAct: st.turn === st.me && !st.pending && used < MAX && !!O.conn, last, lead, status,
    statusErr: statusErr || st.lastCode === "u", thinking, onAct: k => onlineAct(k) };
}
let consoleHandlers = null;
function renderConsole(c) {
  const con = document.getElementById("console");
  con.hidden = false;
  con.className = "console p" + (c.seat + 1);
  consoleHandlers = c;
  const key = c.kind === "answer" ? `a|${c.id}|${c.seat}` : c.kind === "clue" ? `k|${c.k}` : [c.kind, c.seat, c.canAct, c.last, c.lead].join("|");
  if (key !== lastConsoleKey) {
    lastConsoleKey = key;
    if (c.kind === "clue") {
      const s = O.st;
      con.innerHTML = `<div class="in"><div class="turnline"><span>${c.lead}</span></div>${clueFormHTML("ocForm", s.oppName || "your opponent", c.k, s.secret.name)}</div>`;
      const save = t => { s.secret.hints[c.k] = t; sendSide(); render(); focusInput(); };
      document.getElementById("ocForm").onsubmit = e => { e.preventDefault(); const t = document.getElementById("clueIn").value.trim(); if (!t) { document.getElementById("clueIn").focus(); return; } save(t.slice(0, 120)); };
      document.getElementById("clueSkip").onclick = () => save("");

    }

      con.innerHTML = `<div class="in">
        <div class="turnline"><span>${c.lead}</span><span class="yoursecret">Their secret: <b>${esc(O.st.secret.name)}</b> ${wikiLinkHTML(O.st.secret)}</span></div>
        <div class="askedq">${q.kind === "q" ? esc(q.text) : `“${esc(q.text)}”`}</div>
        <div class="answers">${btns}</div>${reactsHTML()}</div>`;
      con.querySelectorAll("[data-a]").forEach(b => b.onclick = () => onlineAnswer(c.id, b.dataset.a));
      bindReacts(con);
      return;
    }
    const keep = document.getElementById("qInput")?.value || "";
    const hadFocus = document.activeElement && document.activeElement.id === "qInput";
    con.innerHTML = `<div class="in">
      <div class="turnline"><span>${c.lead}</span><span id="statusEl" class="status" role="status"></span></div>
      <form class="row" id="qForm">

      </form>${reactsHTML()}</div>`;
    bindReacts(con);
    const inp = document.getElementById("qInput");

// Quick reactions. Online they also go to your opponent.
// The first 6 sit in the bottom bar; the rest live behind "More". Order matters: online sends the index.
const REACTS = ["😂", "😮", "🤔", "🔥", "😬", "👏",
  "🤣", "😅", "😎", "🤯", "😱", "🥳", "😏", "🙄", "😭", "😤",
  "🤩", "😇", "🫣", "🤫", "🤐", "😴", "🥶", "🥵", "🤡", "👀",
  "👍", "👎", "🙌", "🤞", "🫡", "💀", "💯", "✨", "🎉", "🏆",
  "🎯", "🧠", "💡", "❓", "❗", "🚀", "🐐", "🍿", "🎲", "🔮",
  "🙏", "❤️", "💔", "🫠"];
const QUICK = 6;
let lastReactOut = 0, reactIn = [];
const reactsHTML = () => `<div class="reacts" role="group" aria-label="Send a reaction">${REACTS.slice(0, QUICK).map((e, i) => `<button type="button" data-r="${i}" aria-label="React ${e}">${e}</button>`).join("")}<button type="button" class="more" aria-expanded="false" aria-haspopup="true">More</button></div>`;
function bindReacts(root) {
  root.querySelectorAll(".reacts [data-r]").forEach(b => b.onclick = () => sendReact(+b.dataset.r));
  const more = root.querySelector(".reacts .more"); if (!more) return;
  more.onclick = e => { e.stopPropagation(); togglePicker(root, more); };
}
function closePicker() {
  const p = document.querySelector(".emojipick"); if (p) p.remove();
  document.querySelectorAll(".reacts .more").forEach(b => b.setAttribute("aria-expanded", "false"));
}
function togglePicker(root, more) {
  if (document.querySelector(".emojipick")) { closePicker(); more.focus(); return; }
  const pick = document.createElement("div");
  pick.className = "emojipick"; pick.setAttribute("role", "dialog"); pick.setAttribute("aria-label", "All reactions");
  pick.innerHTML = REACTS.map((e, i) => `<button type="button" data-r="${i}" aria-label="React ${e}">${e}</button>`).join("");
  pick.onclick = e => { e.stopPropagation(); const b = e.target.closest("[data-r]"); if (b) { sendReact(+b.dataset.r); closePicker(); } };
  root.querySelector(".in").appendChild(pick);
  more.setAttribute("aria-expanded", "true");
  pick.querySelector("button").focus();
}
document.addEventListener("click", e => { if (!e.target.closest(".emojipick")) closePicker(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.querySelector(".emojipick")) { closePicker(); const m = document.querySelector(".reacts .more"); if (m) m.focus(); } });
function sendReact(i) {
  const now = Date.now(); if (now - lastReactOut < 600 || !REACTS[i]) return;
  lastReactOut = now;
  floatEmoji(REACTS[i], screen === "online" ? "You" : "", "me"); play("pop");
  if (screen === "online" && O && O.conn && O.conn.open) { try { O.conn.send({ t: "react", r: i }); } catch (e) {} }
}
function receiveReact(i) {
  const now = Date.now(); reactIn = reactIn.filter(t => now - t < 2000);
  if (!Number.isInteger(i) || !REACTS[i] || reactIn.length >= 5) return;
  reactIn.push(now);
  floatEmoji(REACTS[i], (O && O.st.oppName) || "Opponent", "them"); play("pop");
}
function floatEmoji(e, who, side) {
  const el = document.createElement("div");
  el.className = "floatmoji";
  const x = side === "me" ? 62 + Math.random() * 18 : 20 + Math.random() * 18;
  el.style.left = x + "vw"; el.style.bottom = "150px";
  el.innerHTML = `<span class="e">${e}</span>${who ? `<span class="n">${esc(who)}</span>` : ""}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// EASTER EGGS
// ===================================================================
function eggToast(text) {
  const t = document.createElement("div"); t.className = "eggtoast"; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2300);
}
SFX.egg = a => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(a, f, i * .06, .16, "square", .07));

// 1) Konami code: arcade mode with a pixel font, scanlines and 8-bit sounds. Enter it again to turn it off.
const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
let konamiAt = 0;
function setArcade(on, quiet) {
  if (on && !document.getElementById("arcadeFont")) {
    const l = document.createElement("link"); l.id = "arcadeFont"; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"; document.head.appendChild(l);
  }
  document.documentElement.classList.toggle("arcade", on);
  SS.set("tq:arcade", on);
  on ? startScene() : stopScene();
  if (!quiet) { eggToast(on ? "INSERT COIN" : "GAME OVER"); play("egg"); lastConsoleKey = ""; render(); }
}
window.addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  konamiAt = k === KONAMI[konamiAt] ? konamiAt + 1 : (k === KONAMI[0] ? 1 : 0);
  if (konamiAt === KONAMI.length) { konamiAt = 0; setArcade(!document.documentElement.classList.contains("arcade")); }
});

// Arcade backdrop: an original pixel-art street with buildings and passing cars, drawn on a canvas.
const SCENE = { P: 3, raf: 0, cv: null, bg: null, cars: [], last: 0 };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildScene() {
  const cv = SCENE.cv, P = SCENE.P;
  const W = Math.ceil(innerWidth / P), H = Math.ceil(innerHeight * .58 / P);
  cv.width = W; cv.height = H;
  const bg = document.createElement("canvas"); bg.width = W; bg.height = H;
  const g = bg.getContext("2d"), R = rng(20261007);
  const ground = Math.round(H * .46), pick = a => a[(R() * a.length) | 0];
  const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); };
  // Buildings
  const walls = [["#E8DDB5", "#C9BC8E"], ["#C9A97A", "#A88A5E"], ["#7FB7A8", "#5E9488"], ["#B85A4A", "#93463A"], ["#8C9BA8", "#6E7C88"], ["#D9C48A", "#B8A46A"], ["#E6CFC0", "#C4A998"]];
  for (let x = -6; x < W;) {
    const w = 26 + ((R() * 34) | 0), h = Math.round(ground * (.35 + R() * .55)), top = ground - h, [wall, shade] = pick(walls);
    rect(x, top, w, h, wall); rect(x + w - 3, top, 3, h, shade); rect(x - 1, top - 2, w + 2, 3, shade);
    const lit = R() < .5;
    for (let wy = top + 6; wy < ground - 16; wy += 9)
      for (let wx = x + 4; wx < x + w - 7; wx += 7) { rect(wx, wy, 4, 5, R() < (lit ? .3 : .12) ? "#F2C230" : "#2A3A44"); rect(wx, wy + 5, 4, 1, shade); }
    const door = x + 4 + ((R() * (w - 14)) | 0);
    rect(door, ground - 11, 7, 11, "#3A2A20"); rect(door + 5, ground - 6, 1, 1, "#F2C230");
    if (R() < .55) { const aw = Math.min(w - 4, 20 + ((R() * 10) | 0)), ax = x + 2, [a1, a2] = pick([["#D8283A", "#F4F0E0"], ["#2E8A7C", "#F4F0E0"], ["#3E8EDB", "#F4F0E0"], ["#E89A2E", "#F4F0E0"]]);
      for (let i = 0; i < aw; i += 2) rect(ax + i, ground - 16, 2, 4, (i / 2) % 2 ? a2 : a1); rect(ax, ground - 12, aw, 1, "#00000044"); }
    if (R() < .35) { const sx = x + w - 9, sh = 10 + ((R() * 10) | 0); rect(sx, top + 8, 5, sh, pick(["#D8283A", "#2E8A7C", "#E89A2E"])); for (let i = 0; i < sh - 3; i += 4) rect(sx + 1, top + 10 + i, 3, 2, "#F2C230"); }
    const r = R();
    if (r < .3) { rect(x + 5, top - 9, 10, 7, "#7A5A3A"); rect(x + 5, top - 9, 10, 1, "#5A4028"); rect(x + 6, top - 2, 1, 2, "#3A2A20"); rect(x + 13, top - 2, 1, 2, "#3A2A20"); }
    else if (r < .5) { rect(x + w - 8, top - 10, 1, 9, "#3A3A3A"); rect(x + w - 11, top - 8, 7, 1, "#3A3A3A"); }
    x += w + (R() < .25 ? 3 + ((R() * 4) | 0) : 0);
  }
  // Sidewalk and street
  rect(0, ground, W, 4, "#B8AE88"); rect(0, ground + 4, W, 2, "#8F7F4A");
  for (let y = ground + 6; y < H; y += 6) { rect(0, y, W, 6, "#E7DDA9"); rect(0, y + 5, W, 1, "#C2B47A"); for (let x = ((y / 6) % 2) * 8; x < W; x += 16) rect(x, y, 1, 5, "#C2B47A"); }
  SCENE.bg = bg; SCENE.ground = ground;
  // Cars: two lanes, opposite directions
  const colors = ["#D8283A", "#3E8EDB", "#F2C230", "#2E8A7C", "#F4F0E0", "#E89A2E"];
  SCENE.cars = [0, 1, 2, 3].map(i => ({ x: R() * W, lane: i % 2, speed: (10 + R() * 12) * (i % 2 ? -1 : 1), color: colors[i % colors.length], van: R() < .3 }));
}
function drawCar(g, c, y) {
  const x = Math.round(c.x), L = c.van ? 24 : 22, dir = c.speed > 0;
  const f = (dx, dy, w, h, col) => { g.fillStyle = col; g.fillRect(dir ? x + dx : x + L - dx - w, y + dy, w, h); };
  f(0, 5, L, 5, c.color); f(0, 9, L, 1, "#00000055");
  if (c.van) { f(2, 0, 18, 6, c.color); f(14, 1, 5, 3, "#BFE6F7"); f(4, 1, 8, 3, "#BFE6F7"); }
  else { f(5, 1, 11, 5, c.color); f(6, 2, 4, 3, "#BFE6F7"); f(11, 2, 4, 3, "#BFE6F7"); }
  f(L - 1, 6, 1, 2, "#FFF6B0"); f(0, 6, 1, 2, "#E8394A");
  f(3, 9, 4, 3, "#1A1A1A"); f(L - 7, 9, 4, 3, "#1A1A1A"); f(4, 10, 2, 1, "#8C8C8C"); f(L - 6, 10, 2, 1, "#8C8C8C");
}
function sceneFrame(t) {
  const cv = SCENE.cv; if (!cv) return;
  const g = cv.getContext("2d"), dt = Math.min(.1, (t - (SCENE.last || t)) / 1000); SCENE.last = t;
  g.clearRect(0, 0, cv.width, cv.height); g.drawImage(SCENE.bg, 0, 0);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, W = cv.width;
  for (const c of SCENE.cars.slice().sort((a, b) => b.lane - a.lane)) {
    if (!still) { c.x += c.speed * dt; if (c.x > W + 30) c.x = -30; if (c.x < -30) c.x = W + 30; }
    drawCar(g, c, SCENE.ground + (c.lane ? 6 : 16));
  }
  SCENE.raf = still ? 0 : requestAnimationFrame(sceneFrame);
}
function startScene() {
  if (SCENE.cv) return;
  const cv = document.createElement("canvas"); cv.id = "arcadeScene"; cv.setAttribute("aria-hidden", "true");
  document.body.prepend(cv); SCENE.cv = cv; SCENE.last = 0;
  buildScene(); SCENE.raf = requestAnimationFrame(sceneFrame);
}
function stopScene() { cancelAnimationFrame(SCENE.raf); if (SCENE.cv) SCENE.cv.remove(); SCENE.cv = null; }
let sceneResize;
window.addEventListener("resize", () => { if (!SCENE.cv) return; clearTimeout(sceneResize); sceneResize = setTimeout(() => { buildScene(); if (!SCENE.raf) SCENE.raf = requestAnimationFrame(sceneFrame); }, 150); });

if (SS.get("tq:arcade") === true) setArcade(true, true);

// 2) Click the logo 5 times quickly: a "bonus round" that is really a rickroll.
let logoClicks = [];
document.querySelector(".top h1").addEventListener("click", () => {
  const now = Date.now(); logoClicks = logoClicks.filter(t => now - t < 2500); logoClicks.push(now);
  if (logoClicks.length >= 5) { logoClicks = []; rickroll(); }
});
function rickroll() {
  if (document.querySelector(".eggmodal")) return;
  const m = document.createElement("div"); m.className = "eggmodal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", "Secret bonus round");
  m.innerHTML = `<div class="card"><h2>Secret bonus round unlocked!</h2>
    <div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0" title="Never Gonna Give You Up" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <div class="actions"><button class="go" type="button" id="eggClose">Back to the game</button><a class="linkbtn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">Video not playing? Open it on YouTube</a></div></div>`;
  const close = () => { m.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") close(); };

  document.addEventListener("keydown", esc_);
  document.getElementById("eggClose").focus();
}

// 3) Tap a podium's neon stripes: they light up in turn with a little jingle (each podium has its own).
SFX.jingle1 = a => [659, 784, 1046].forEach((f, i) => tone(a, f, i * .12, .2, "triangle", .14));
SFX.jingle2 = a => [1046, 880, 698].forEach((f, i) => tone(a, f, i * .12, .2, "triangle", .14));

  const st = e.target.closest(".stripes"); if (!st) return;
  const pod = st.closest(".pod");
  st.classList.remove("flash"); void st.offsetWidth; st.classList.add("flash");

// End match: first tap arms the button, second tap within 4 seconds ends it.
let endTimer = null;
function disarmEnd() {
  clearTimeout(endTimer); endTimer = null;
  const b = document.getElementById("endBtn");
  b.classList.remove("armed"); b.textContent = "End match";
}
document.getElementById("endBtn").onclick = () => {
  const b = document.getElementById("endBtn");
  if (!endTimer) {
    b.classList.add("armed"); b.textContent = "Tap again to end";
    endTimer = setTimeout(disarmEnd, 4000);
    return;
  }
  disarmEnd();
  if (screen === "local" && L) { L.ended = true; L.stage = "ask"; L.pending = null; setStatus(""); }
  else if (screen === "online" && O) { O.st.ended = true; setStatus(""); sendSide(); }
  render();
};
document.getElementById("homeBtn").onclick = () => {
  if (screen === "online") onlineLeave();
  else { L = null; screen = "home"; setStatus(""); hideConsole(); render(); }
};
window.addEventListener("beforeunload", () => { try { O && O.peer && O.peer.destroy(); } catch (e) {} });
render();
